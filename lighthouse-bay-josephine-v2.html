<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Lighthouse Bay — Check-in Guide</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 80px auto;
      padding: 0 20px;
      text-align: center;
      color: #333;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #eee;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #fallback { display: none; margin-top: 24px; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Loading your check-in guide&hellip;</p>
  <div id="fallback">
    <p>If you are not redirected automatically, <a id="fallback-link" href="https://dreamzunlimitedvacations.github.io/guest-checkins/">click here</a>.</p>
  </div>
  <noscript>
    <p>JavaScript is required to load the latest guide. Please visit our <a href="https://dreamzunlimitedvacations.github.io/guest-checkins/">check-in page</a> directly.</p>
  </noscript>
  <script>
    (function () {
      var FALLBACK = "https://dreamzunlimitedvacations.github.io/guest-checkins/";
      var configUrl = "redirect-target.json?t=" + Date.now();

      // Show fallback link after 3s in case redirect is slow or fails silently.
      setTimeout(function () {
        document.getElementById("fallback").style.display = "block";
      }, 3000);

      fetch(configUrl, { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("config fetch failed: " + r.status);
          return r.json();
        })
        .then(function (data) {
          var target = (data && typeof data.url === "string") ? data.url : FALLBACK;
          window.location.replace(target);
        })
        .catch(function () {
          window.location.replace(FALLBACK);
        });
    })();
  </script>
</body>
</html>
